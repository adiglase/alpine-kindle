# alpine.conf - upstart job: shut the Kindle UI down, run the Alpine desktop, restore it on exit.
# Derived from schuhumi/alpine_kindle (GPL-3.0) - see README.md.
#
# Install (from kterm or SSH on the Kindle):
#   mntroot rw
#   cp /mnt/us/alpine.conf /etc/upstart/
#   mntroot r
#
# Start:  start alpine        (from kterm or SSH - drops straight into the MATE desktop)
# Stop:   stop alpine         (from inside Alpine: `stop alpine` will not work; use exit in kterm)
#
# Starting it this way stops the Kindle GUI first, which frees a large amount of
# RAM - the reason this is preferred over running the desktop from kterm.

env US=/mnt/us

pre-start script
  [ -d "$US" ] || US=/mnt/base-us
  echo "Log from $(date)" > "$US/alpine.log"
  exec >>"$US/alpine.log" 2>&1
  echo "# Alpine ::: pre-start"
  echo "Mounting Alpine rootfs from $US/alpine.ext3"

  mkdir -p /tmp/alpine
  mount -o loop,noatime -t ext3 "$US/alpine.ext3" /tmp/alpine
  mount -o bind /dev     /tmp/alpine/dev
  mount -o bind /dev/pts /tmp/alpine/dev/pts
  mount -o bind /proc    /tmp/alpine/proc
  mount -o bind /sys     /tmp/alpine/sys
  mount -o bind /var/run/dbus /tmp/alpine/run/dbus 2>/dev/null

  [ -r /etc/hosts ] && cp /etc/hosts /tmp/alpine/etc/hosts
  if [ -r /etc/resolv.conf ]; then
    cp -L /etc/resolv.conf /tmp/alpine/etc/resolv.conf
  else
    echo "nameserver 8.8.8.8" > /tmp/alpine/etc/resolv.conf
  fi
  chmod a+w /dev/shm 2>/dev/null

  # Optional swap. swap.img is a formatted block image: attach, then swap on the
  # loop device (a swap file cannot live on the vfat userstore).
  if [ -f "$US/swap.img" ]; then
    SWAPLOOP="$(losetup -f 2>/dev/null)"
    if [ -n "$SWAPLOOP" ] && losetup "$SWAPLOOP" "$US/swap.img" 2>/dev/null; then
      if swapon "$SWAPLOOP" 2>/dev/null; then
        echo "$SWAPLOOP" > /tmp/alpine.swaploop
        echo "Swap enabled on $SWAPLOOP"
      else
        losetup -d "$SWAPLOOP" 2>/dev/null
        echo "swapon failed - continuing without swap"
      fi
    fi
  fi
end script

script
  [ -d "$US" ] || US=/mnt/base-us
  exec >>"$US/alpine.log" 2>&1
  echo "# Alpine ::: script"

  # Use absolute paths: upstart jobs run with a minimal PATH, and /sbin is not
  # always on it (a bare `stop` fails with "Unknown instance").
  INITCTL=/sbin/initctl
  [ -x "$INITCTL" ] || INITCTL=/sbin/stop

  sleep 1
  echo "Stopping the Kindle UI to free RAM"
  "$INITCTL" stop lab126_gui || echo "WARNING: could not stop lab126_gui (continuing)"

  # Stopping the UI also stops pillowd (pillow.conf: "stop on stopping
  # lab126_gui"), and pillowd is what pushes the framebuffer to the e-ink panel.
  # Without this the screen freezes the moment we stop the UI. X and awesome
  # belong to the separate 'x' job and survive.
  echo "Restarting pillowd so the panel keeps updating"
  "$INITCTL" start pillow || echo "WARNING: could not start pillow"
  sleep 2

  su -c "chroot /tmp/alpine /startgui.sh"

  # Kill Xephyr by pid, with no bare `kill` and no pgrep (job PATH is minimal:
  # an unset pgrep expands to an empty argument list, and a bare `kill` then
  # signals the job's own shell, which is what made `stop alpine` fail).
  echo "Desktop session ended, killing Xephyr"
  for p in /proc/[0-9]*; do
    [ -r "$p/comm" ] || continue
    if [ "$(cat "$p/comm" 2>/dev/null)" = "Xephyr" ]; then
      kill "${p#/proc/}" 2>/dev/null
      echo "  killed Xephyr pid ${p#/proc/}"
    fi
  done
  # Also make sure nothing is left holding the rootfs.
  for p in /proc/[0-9]*; do
    [ -r "$p/comm" ] || continue
    case "$(cat "$p/comm" 2>/dev/null)" in
      mate-session|marco|mate-panel|caja|mate-screensaver|onboard)
        kill "${p#/proc/}" 2>/dev/null ;;
    esac
  done
  sleep 2
end script

post-stop script
  [ -d "$US" ] || US=/mnt/base-us
  exec >>"$US/alpine.log" 2>&1
  echo "# Alpine ::: post-stop"
  INITCTL=/sbin/initctl
  [ -x "$INITCTL" ] || INITCTL=/sbin/start

  # upstart kills this section if it runs too long, so every step is bounded and
  # failures are reported rather than retried forever (that is what left the
  # rootfs mounted and the UI down).
  detach_loop_for() {
    BASE="$(basename "$1")"
    for b in /sys/block/loop*; do
      [ -r "$b/loop/backing_file" ] || continue
      case "$(cat "$b/loop/backing_file" 2>/dev/null)" in
        *"$BASE")
          N="${b##*/}"
          if [ -b "/dev/$N" ]; then losetup -d "/dev/$N" 2>/dev/null;
          else losetup -d "/dev/loop/${N#loop}" 2>/dev/null; fi
          echo "Detached loop device ${N#loop}"
          ;;
      esac
    done
  }

  if [ -f /tmp/alpine.swaploop ]; then
    SWAPLOOP="$(cat /tmp/alpine.swaploop)"
    swapoff "$SWAPLOOP" 2>/dev/null
    losetup -d "$SWAPLOOP" 2>/dev/null
    rm -f /tmp/alpine.swaploop
    echo "Swap disabled"
  fi

  echo "Unmounting Alpine rootfs"
  umount /tmp/alpine/run/dbus 2>/dev/null
  umount /tmp/alpine/sys 2>/dev/null
  umount /tmp/alpine/proc 2>/dev/null
  umount /tmp/alpine/dev/pts 2>/dev/null
  umount /tmp/alpine/dev 2>/dev/null
  sync
  umount /tmp/alpine 2>/dev/null
  if mount | grep -q "on /tmp/alpine "; then
    # One bounded retry, then give up and say so. Never loop here.
    sleep 2
    umount /tmp/alpine 2>/dev/null
  fi
  if mount | grep -q "on /tmp/alpine "; then
    echo "WARNING: /tmp/alpine is still mounted - run 'sh $US/alpine.sh cleanup'"
  else
    echo "Alpine unmounted."
  fi

  detach_loop_for "$US/alpine.ext3"
  detach_loop_for "$US/swap.img"

  echo "Restarting the Kindle UI"
  "$INITCTL" start lab126_gui || echo "WARNING: could not restart lab126_gui"
end script
