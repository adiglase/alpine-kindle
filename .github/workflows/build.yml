name: build

# There is no hardware in CI, but the expensive part of this project is the
# package set: upstream's 2019 script died because four of the packages it
# installed were removed from Alpine. This rebuilds the image and fails loudly
# when that happens again, so breakage is caught on a push instead of by a user.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: Alpine moves, and we want to know before users do.
    - cron: '0 6 * * 1'

# Keep release builds on a stable Alpine line. The exact point release selected
# from this branch is captured in BUILD-INFO.txt and published with the zip.
env:
  ALPINE_BRANCH: v3.24

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Shell syntax checks
        run: |
          bash -n build-image.sh
          bash -n create-release.sh
          bash -n tools/screenshot.sh
          sh   -n alpine.sh
          sh   -n tools/install.sh
          sh   -n tools/diag.sh
          sh   -n tools/uninstall.sh
          # upstart job: check the script bodies parse
          sed -e '/^[a-z-]* script$/d' -e '/^end script$/d' contrib/alpine.conf | sh -n

      - name: Verify the Alpine package set still resolves (armv7)
        run: |
          set -euo pipefail
          REPO="https://dl-cdn.alpinelinux.org/alpine/$ALPINE_BRANCH"
          mkdir -p /tmp/apkindex
          curl -fsSL -o /tmp/APKINDEX.tar.gz "$REPO/main/x86_64/APKINDEX.tar.gz"
          tar -xzf /tmp/APKINDEX.tar.gz -C /tmp/apkindex APKINDEX
          VER=$(awk -F: '/^P:apk-tools-static$/{p=1} p&&/^V:/{print $2; exit}' /tmp/apkindex/APKINDEX)
          test -n "$VER"
          curl -fsSL -o /tmp/apk.apk \
            "$REPO/main/x86_64/apk-tools-static-${VER}.apk"
          tar -xzf /tmp/apk.apk -C /tmp
          # This is the check that matters: if a package below disappears upstream,
          # this step fails with "unable to select packages".
          /tmp/sbin/apk.static --arch armv7 \
            -U --allow-untrusted --simulate --no-cache \
            -X "$REPO/main" \
            -X "$REPO/community" \
            fetch --recursive \
                alpine-base xorg-server-xephyr xwininfo xdpyinfo xauth xdotool xinput xset xterm \
                dbus dbus-x11 mate-desktop-environment mate-themes mate-icon-theme \
                onboard netsurf sudo bash nano git curl unzip desktop-file-utils \
                font-dejavu font-liberation font-noto chromium

      - name: Build the image
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Tagged releases use the documented, device-ready defaults.
            sudo ALPINE_BRANCH="$ALPINE_BRANCH" IMAGESIZE_MB=2560 SWAP_MB=512 \
              RELEASE_TAG="$GITHUB_REF_NAME" SOURCE_COMMIT="$GITHUB_SHA" ./build-image.sh
          else
            # Routine CI omits swap and uses a smaller image to save runner time.
            sudo ALPINE_BRANCH="$ALPINE_BRANCH" IMAGESIZE_MB=2048 SWAP_MB=0 \
              ./build-image.sh
          fi

      - name: Inspect the built image
        run: |
          set -euo pipefail
          test -f release/alpine.ext3
          # must contain the right Alpine version and must NOT contain host binaries
          ALPINE_RELEASE="$(
            debugfs -R "cat /etc/alpine-release" release/alpine.ext3 2>/dev/null
          )"
          grep -E '^3\.24\.' <<<"$ALPINE_RELEASE"
          ! debugfs -R "ls /usr/bin" release/alpine.ext3 2>/dev/null | grep -q qemu-arm-static
          test "$(debugfs -R 'cat /etc/shadow' release/alpine.ext3 2>/dev/null | grep '^alpine:' | cut -d: -f2)" = '!'
          debugfs -R 'cat /etc/dconf/db/local.d/00-kindle' release/alpine.ext3 2>/dev/null \
            | grep -Fx "embedded-keyboard-command='onboard -e'"
          debugfs -R 'cat /etc/dconf/db/local.d/00-kindle' release/alpine.ext3 2>/dev/null \
            | grep -Fx 'toolkit-accessibility=true'
          debugfs -R 'cat /etc/xdg/autostart/onboard.desktop' release/alpine.ext3 2>/dev/null \
            | grep -Fx 'Exec=onboard'
          unzip -t release/alpine.zip
          for file in alpine.ext3 alpine.sh alpine.conf install.sh uninstall.sh diag.sh \
                      alpine-kindle-docs/README.md alpine-kindle-docs/LICENSE \
                      alpine-kindle-docs/BUILD-INFO.txt \
                      alpine-kindle-docs/COMPATIBILITY.md \
                      alpine-kindle-docs/KNOWN-ISSUES.md \
                      alpine-kindle-docs/TROUBLESHOOTING.md; do
            unzip -Z1 release/alpine.zip | grep -Fx "$file"
          done
          test -f release/alpine.zip.sha256
          (cd release && sha256sum --check alpine.zip.sha256)
          grep -Fx "Alpine branch: $ALPINE_BRANCH" release/BUILD-INFO.txt
          grep -Fx "Alpine release: $ALPINE_RELEASE" release/BUILD-INFO.txt
          unzip -p release/alpine.zip alpine-kindle-docs/BUILD-INFO.txt \
            | cmp - release/BUILD-INFO.txt
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test -f release/swap.img
            unzip -Z1 release/alpine.zip | grep -Fx swap.img
            grep -Fx "Source tag: $GITHUB_REF_NAME" release/BUILD-INFO.txt
            grep -Fx "Source commit: $GITHUB_SHA" release/BUILD-INFO.txt
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: alpine-kindle-image
          path: |
            release/alpine.zip
            release/alpine.zip.sha256
            release/BUILD-INFO.txt
          retention-days: 14
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: alpine-kindle-image
          path: release

      - name: Verify assets before publishing
        working-directory: release
        run: |
          test -f alpine.zip
          test -f alpine.zip.sha256
          test -f BUILD-INFO.txt
          sha256sum --check alpine.zip.sha256
          unzip -tq alpine.zip
          unzip -p alpine.zip alpine-kindle-docs/BUILD-INFO.txt | cmp - BUILD-INFO.txt

      - name: Create the GitHub Release and upload assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              release/alpine.zip release/alpine.zip.sha256 release/BUILD-INFO.txt \
              --clobber
          else
            gh release create "$TAG" \
              release/alpine.zip release/alpine.zip.sha256 release/BUILD-INFO.txt \
              --verify-tag --generate-notes --title "$TAG"
          fi

      - name: Download and verify the published release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir verified-release
          gh release download "$TAG" --dir verified-release \
            --pattern alpine.zip --pattern alpine.zip.sha256 --pattern BUILD-INFO.txt
          cd verified-release
          test -f alpine.zip
          test -f alpine.zip.sha256
          test -f BUILD-INFO.txt
          sha256sum --check alpine.zip.sha256
          unzip -tq alpine.zip
          unzip -p alpine.zip alpine-kindle-docs/BUILD-INFO.txt | cmp - BUILD-INFO.txt
